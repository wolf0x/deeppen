<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d1117"/>
  <rect x="0" y="0" width="200" height="500" fill="#161b22"/>
  <rect x="200" y="0" width="600" height="50" fill="#161b22"/>

  <!-- Sidebar -->
  <text x="20" y="30" fill="#4fc3f7" font-size="14" font-weight="bold">🏴‍☠️ DeepPen</text>
  <text x="30" y="70" fill="#8b949e" font-size="12">📊 Kanban</text>
  <rect x="10" y="85" width="180" height="30" rx="4" fill="#1c2128"/>
  <text x="30" y="105" fill="#e6edff" font-size="12">💬 Chat</text>
  <text x="30" y="140" fill="#8b949e" font-size="12">📋 Tasks</text>

  <!-- Chat sessions -->
  <text x="20" y="160" fill="#8b949e" font-size="10">Sessions</text>
  <rect x="10" y="170" width="180" height="25" rx="4" fill="#1c2128"/>
  <text x="20" y="187" fill="#e6edff" font-size="10">Web CTF Challenge</text>

  <!-- Header -->
  <text x="220" y="30" fill="#e6edff" font-size="16" font-weight="bold">Chat</text>
  <text x="220" y="45" fill="#8b949e" font-size="10">Web CTF Challenge</text>

  <!-- User message -->
  <rect x="400" y="70" width="350" height="60" rx="12" fill="#4fc3f7" fill-opacity="0.15" stroke="#4fc3f7" stroke-opacity="0.3"/>
  <text x="410" y="90" fill="#e6edff" font-size="11">There's a web CTF at localhost:3001</text>
  <text x="410" y="105" fill="#e6edff" font-size="11">Solve all challenges</text>

  <!-- Assistant message -->
  <rect x="220" y="150" width="400" height="80" rx="12" fill="#161b22" stroke="#30363d"/>
  <text x="230" y="170" fill="#4fc3f7" font-size="11">I'll create a task for you:</text>
  <rect x="230" y="180" width="380" height="40" rx="6" fill="#1c2128" stroke="#30363d"/>
  <text x="240" y="195" fill="#e6edff" font-size="10" font-family="monospace">{"action":"create_task",</text>
  <text x="240" y="210" fill="#e6edff" font-size="10" font-family="monospace"> "name":"Web CTF Challenge"}</text>

  <!-- Task created notification -->
  <rect x="250" y="245" width="300" height="35" rx="8" fill="#3fb950" fill-opacity="0.15" stroke="#3fb950" stroke-opacity="0.3"/>
  <text x="270" y="265" fill="#3fb950" font-size="11">✅ Task created: Web CTF Challenge — Click to view →</text>

  <!-- Input area -->
  <rect x="220" y="440" width="520" height="40" rx="8" fill="#1c2128" stroke="#30363d"/>
  <text x="230" y="465" fill="#8b949e" font-size="11">Describe your CTF challenge...</text>
  <rect x="680" y="445" width="50" height="30" rx="6" fill="#4fc3f7"/>
  <text x="693" y="465" fill="#0d1117" font-size="11" font-weight="bold">Send</text>
</svg>
