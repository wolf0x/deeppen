  <rect x="530" y="70" width="638" height="580" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="560" y="100" fill="#e6edff" font-size="18" font-weight="bold">Writeup: HTB Web Challenge</text>
  <text x="560" y="136" fill="#4fc3f7" font-size="14" font-weight="bold">## Challenge Info</text>
  <text x="560" y="158" fill="#e6edff" font-size="12">- **Category:** Web Security</text>
  <text x="560" y="176" fill="#e6edff" font-size="12">- **Platform:** HTB</text>
  <text x="560" y="194" fill="#e6edff" font-size="12">- **Solved by:** DeepPen (AI)</text>
  <text x="560" y="212" fill="#e6edff" font-size="12">- **Time:** 14m 32s</text>
  <text x="560" y="240" fill="#4fc3f7" font-size="14" font-weight="bold">## Challenge Description</text>
  <text x="560" y="262" fill="#8b949e" font-size="12">&gt; Find the SQL injection vulnerability in the login form</text>
  <text x="560" y="292" fill="#4fc3f7" font-size="14" font-weight="bold">## Approach</text>
  <text x="560" y="318" fill="#d2a8ff" font-size="13" font-weight="bold">### Phase 1: Reconnaissance (0:00 - 3:15)</text>
  <text x="560" y="340" fill="#e6edff" font-size="12">- Read login.html — identified hidden 'debug' parameter</text>
  <text x="560" y="358" fill="#e6edff" font-size="12">- Used grep to search for SQL-related patterns</text>
  <text x="560" y="376" fill="#e6edff" font-size="12">- Found 3 potential injection points</text>
  <text x="560" y="402" fill="#d2a8ff" font-size="13" font-weight="bold">### Phase 2: Exploitation (3:15 - 11:42)</text>
  <text x="560" y="424" fill="#e6edff" font-size="12">- Tried ' OR 1=1-- on login form → rejected</text>
  <text x="560" y="442" fill="#e6edff" font-size="12">- Spawned subagent for UNION-based injection</text>
  <text x="560" y="460" fill="#e6edff" font-size="12">- Discovered column count via ORDER BY enumeration</text>
  <text x="560" y="486" fill="#4fc3f7" font-size="14" font-weight="bold">## Flag</text>
  <text x="560" y="508" fill="#3fb950" font-size="14" font-weight="bold">flag{sql_1nj3ction_ftw}</text>
  <text x="560" y="538" fill="#4fc3f7" font-size="14" font-weight="bold">## Tools Used</text>
  <text x="560" y="560" fill="#e6edff" font-size="12">| Tool | Count |</text>
  <text x="560" y="578" fill="#e6edff" font-size="12">|------|-------|</text>
  <text x="560" y="596" fill="#e6edff" font-size="12">| read_file | 12 |</text>
  <text x="560" y="614" fill="#e6edff" font-size="12">| grep | 8 |</text>
  <text x="560" y="632" fill="#e6edff" font-size="12">| execute | 15 |</text>
