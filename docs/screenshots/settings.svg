<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <rect width="800" height="500" fill="#0d1117"/>
  <rect x="0" y="0" width="200" height="500" fill="#161b22"/>

  <!-- Sidebar -->
  <text x="20" y="30" fill="#4fc3f7" font-size="14" font-weight="bold">🏴‍☠️ DeepPen</text>
  <text x="30" y="70" fill="#8b949e" font-size="12">📊 Kanban</text>
  <text x="30" y="100" fill="#8b949e" font-size="12">💬 Chat</text>
  <text x="30" y="130" fill="#8b949e" font-size="12">📋 Tasks</text>
  <rect x="10" y="380" width="180" height="30" rx="4" fill="#1c2128"/>
  <text x="30" y="400" fill="#e6edff" font-size="12">⚙️ Settings</text>

  <!-- Header -->
  <rect x="200" y="0" width="600" height="50" fill="#161b22"/>
  <text x="220" y="30" fill="#e6edff" font-size="16" font-weight="bold">Settings</text>
  <rect x="700" y="15" width="60" height="25" rx="4" fill="#4fc3f7"/>
  <text x="713" y="32" fill="#0d1117" font-size="11" font-weight="bold">Save</text>

  <!-- Agent Limits Section -->
  <rect x="210" y="60" width="580" height="180" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="220" y="80" fill="#e6edff" font-size="13" font-weight="bold">🤖 Agent Limits</text>
  <text x="220" y="95" fill="#8b949e" font-size="10">Controls how long the agent runs before stopping</text>

  <text x="230" y="120" fill="#e6edff" font-size="11">Max Iterations</text>
  <text x="230" y="133" fill="#8b949e" font-size="9">Maximum number of model calls per task</text>
  <rect x="600" y="115" width="80" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="640" y="130" fill="#e6edff" font-size="11" text-anchor="middle">100</text>

  <text x="230" y="160" fill="#e6edff" font-size="11">Max Time (minutes)</text>
  <text x="230" y="173" fill="#8b949e" font-size="9">Agent will stop after this many minutes</text>
  <rect x="600" y="155" width="80" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="640" y="170" fill="#e6edff" font-size="11" text-anchor="middle">30</text>

  <text x="230" y="200" fill="#e6edff" font-size="11">Max Tool Calls</text>
  <text x="230" y="213" fill="#8b949e" font-size="9">Maximum number of tool executions per task</text>
  <rect x="600" y="195" width="80" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="640" y="210" fill="#e6edff" font-size="11" text-anchor="middle">500</text>

  <!-- Loop Agent Section -->
  <rect x="210" y="250" width="580" height="200" rx="8" fill="#161b22" stroke="#30363d"/>
  <text x="220" y="270" fill="#e6edff" font-size="13" font-weight="bold">🔄 Loop Agent</text>
  <text x="220" y="285" fill="#8b949e" font-size="10">Automatic task optimization and retry</text>

  <text x="230" y="310" fill="#e6edff" font-size="11">Enabled</text>
  <text x="230" y="323" fill="#8b949e" font-size="9">Enable automatic task review</text>
  <rect x="650" y="305" width="40" height="20" rx="10" fill="#3fb950"/>
  <circle cx="680" cy="315" r="8" fill="white"/>

  <text x="230" y="350" fill="#e6edff" font-size="11">Check Interval (minutes)</text>
  <rect x="600" y="340" width="80" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="640" y="355" fill="#e6edff" font-size="11" text-anchor="middle">5</text>

  <text x="230" y="380" fill="#e6edff" font-size="11">Stale Threshold (minutes)</text>
  <rect x="600" y="370" width="80" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="640" y="385" fill="#e6edff" font-size="11" text-anchor="middle">10</text>

  <text x="230" y="410" fill="#e6edff" font-size="11">Model</text>
  <rect x="400" y="400" width="280" height="22" rx="4" fill="#1c2128" stroke="#30363d"/>
  <text x="410" y="415" fill="#8b949e" font-size="10">Default (first available)</text>
</svg>
